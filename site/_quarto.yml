format:
  html:
    theme: theme/bed3.scss
    toc: false
    # Quarto wraps each heading's content in a <section>. That wrapper closes at
    # the next heading of equal or higher level, which crosses any fenced div a
    # heading sits inside — the div then closes implicitly and its closing
    # fence leaks onto the page as literal colons. Nothing here needs section
    # divs, and turning them off lets headings live inside layout blocks.
    section-divs: false
    anchor-sections: true
    link-external-newwindow: true
    # Pinned: Quarto references katex@latest on the CDN otherwise, and an
    # upstream KaTeX release mid-semester is not a risk worth taking.
    html-math-method:
      method: katex
      url: "https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/"
    include-in-header: _includes/head.html
    include-after-body:
      - _includes/quiz.html
      - _includes/nav.html

lang: nb
